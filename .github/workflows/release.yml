name: macOS development packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Unsigned Apple Silicon preview
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DELA_REMOTE_HOST: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm smoke:jlu
      - name: Build development DMG and ZIP
        run: pnpm package:mac
      - name: Verify archives
        run: node scripts/verify-macos-package.ts "dist/mac-arm64/JLU-Dela.app"
      - name: Smoke test packaged app
        run: pnpm smoke:jlu "dist/mac-arm64/JLU-Dela.app/Contents/Resources/app.asar"
      - name: Record checksums and source
        working-directory: dist
        run: |
          shasum -a 256 *.dmg *.zip > SHA256SUMS
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@v6
        with:
          name: JLU-Dela-mac-arm64-development
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
            dist/source-commit.txt
          if-no-files-found: error
          retention-days: 14
