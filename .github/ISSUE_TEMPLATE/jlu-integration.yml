name: 吉大校园接入
description: 补充课表、课程资料或通知的接入资料
title: '[JLU] '
body:
  - type: dropdown
    id: service
    attributes:
      label: 平台
      options:
        - 本科教务系统
        - 电子校务平台
        - 学在吉大
        - 其他课程资料来源
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与入口
      description: 说明想读取的页面、期望结果，以及是否需要校园网或登录。不要填写账号或凭据。
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 脱敏结构与操作说明
      description: 仅提供人工构造的结构或已彻底脱敏的样例；不要上传完整 HAR、Cookie、令牌、学号或成绩。
  - type: checkboxes
    id: privacy
    attributes:
      label: 样例检查
      options:
        - label: 我确认公开内容不包含个人信息、密码、Cookie、令牌或未脱敏校园数据。
          required: true
